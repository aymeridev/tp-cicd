name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
      - name: Lancer les tests
        run: |
          pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Construire l'image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tp-cicd:latest .
      - name: Exporter l'image
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/tp-cicd:latest -o image.tar
      - name: Sauvegarder l'image
        uses: actions/upload-artifact@v4
        with:
          name: image-docker
          path: image.tar
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l'image
        uses: actions/download-artifact@v4
        with:
          name: image-docker
      - name: Charger l'image
        run: |
          docker load -i image.tar
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publier l'image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tp-cicd:latest
